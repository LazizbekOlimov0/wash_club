name: wash_club
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter_localizations:
    sdk: flutter

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.2.0
  provider: ^6.1.5+1
  go_router: ^17.2.2
  i18n_extension: ^15.1.0
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  animations: ^2.2.0
  universal_io: ^2.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.4.0
  slang_build_runner: ^4.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/

flutter_gen:
  output: lib/core/assets/
  assets:
    outputs:
      class_name: WashClubAssets
  integrations:
    flutter_svg: true


