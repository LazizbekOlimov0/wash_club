# ── pubspec.yaml ga qo'shish kerak ────────────────────────────────

flutter:
  assets:
    - assets/icons/nav_bar/   # ← SVG ikonkalar shu papkada bo'lishi kerak

flutter_gen:
  output: lib/core/assets/
  line_length: 100
  assets:
    enabled: true
    outputs:
      class_name: WashClubAssets   # UiKitAssets o'rniga WashClubAssets
  integrations:
    flutter_svg: true


# ── Kerakli SVG fayl nomlari (assets/icons/nav_bar/) ─────────────
