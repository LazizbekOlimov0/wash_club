name: wash_club
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.2+13

environment:
  sdk: ^3.11.0


dependencies:
  flutter_localizations:
    sdk: flutter

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.2.0
  go_router: ^17.2.2
  i18n_extension: ^15.1.0
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  animations: ^2.2.0
  shared_preferences: ^2.5.5
  google_sign_in: ^6.3.0
  supabase_flutter: ^2.8.0
  crypto: ^3.0.3
  uuid: ^4.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  http: ^1.6.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.4.0
  slang_build_runner: ^4.14.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/image/branches/

flutter_gen:
  output: lib/core/assets/
  assets:
    outputs:
      class_name: WashClubAssets
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  image_path: "assets/image/wash_club.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0F1B35"
  adaptive_icon_foreground: "assets/image/wash_club.png"


