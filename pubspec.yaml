name: wash_club
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  bloc: ^9.2.0
  provider: ^6.1.5+1
  go_router: ^17.2.2
  i18n_extension: ^15.1.0
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  build_runner: ^2.14.1
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  assets:
    - assets/image/
    - assets/icons/nav_bar/

flutter_gen:
  output: lib/core/assets/
  assets:
    outputs:
      class_name: WashClubAssets
  integrations:
    flutter_svg: true

  uses-material-design: true
